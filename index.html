<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Private Tab Beam - Viewer</title>
  <style>
    :root {
      --bg-color: #1c1c1e;
      --card-bg: #2c2c2e;
      --card-border: #3a3a3c;
      --text-main: #f2f2f7;
      --text-muted: #8e8e93;
      --accent: #0a84ff;
      --accent-hover: #0071e3;
      --error-color: #ff453a;
      --visited-color: #636366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "BIZ UDPGothic", sans-serif;
      line-height: 1.5;
      padding: 16px;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.8rem;
      background-color: var(--accent);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .btn:active {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    #error-container {
      background-color: rgba(255, 69, 58, 0.15);
      border: 1px solid var(--error-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    #error-container h2 {
      font-size: 1rem;
      color: var(--error-color);
      margin-bottom: 6px;
    }

    #error-container p {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    ul.tab-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li.tab-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: opacity 0.2s, background-color 0.2s;
    }

    li.tab-item.visited {
      opacity: 0.55;
      background-color: rgba(44, 44, 46, 0.5);
    }

    li.tab-item a {
      display: block;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      outline: none;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      word-break: break-all;
    }

    li.tab-item.visited .item-title {
      color: var(--visited-color);
      text-decoration: line-through;
    }

    .item-url {
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div id="error-container">
    <h2 id="error-title">エラー</h2>
    <p id="error-message"></p>
  </div>

  <header id="viewer-header" style="display: none;">
    <h1>
      <span>Private Tab Beam</span>
      <span id="chunk-badge" class="badge" style="display: none;"></span>
    </h1>
    <div class="meta-bar">
      <span id="tab-count"></span>
      <button id="copy-all-btn" class="btn btn-secondary" type="button">全URLをコピー</button>
    </div>
  </header>

  <main>
    <ul id="tab-list" class="tab-list"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">タブが見つかりません</div>
  </main>

  <script>
    'use strict';

    function showError(title, message) {
      const errBox = document.getElementById('error-container');
      const errTitle = document.getElementById('error-title');
      const errMessage = document.getElementById('error-message');
      errTitle.textContent = title;
      errMessage.textContent = message;
      errBox.style.display = 'block';
    }

    function base64UrlToUint8Array(base64url) {
      let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const pad = (4 - (base64.length % 4)) % 4;
      base64 += '='.repeat(pad);

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function rawInflate(uint8Array) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('DecompressionStream is not supported');
      }
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(uint8Array);
      writer.close();
      const reader = ds.readable.getReader();
      const chunks = [];
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      const result = new Uint8Array(totalLen);
      let offset = 0;
      for (const c of chunks) {
        result.set(c, offset);
        offset += c.length;
      }
      return result;
    }

    async function decodeFragment(fragment) {
      if (typeof fragment !== 'string') {
        throw new Error('Fragment must be a string');
      }
      const cleanFrag = fragment.startsWith('#') ? fragment.slice(1) : fragment;
      const parts = cleanFrag.split('.');
      if (parts.length !== 4 || parts[0] !== 'v1') {
        throw new Error('Invalid fragment format: expected v1.<idx>.<total>.<data>');
      }
      const idx = parseInt(parts[1], 10);
      const total = parseInt(parts[2], 10);
      if (isNaN(idx) || isNaN(total) || idx < 1 || total < 1 || idx > total) {
        throw new Error('Invalid fragment indices: idx must be between 1 and total');
      }
      const b64 = parts[3];
      const compressed = base64UrlToUint8Array(b64);
      const decompressed = await rawInflate(compressed);
      const decoder = new TextDecoder();
      const jsonStr = decoder.decode(decompressed);
      const items = JSON.parse(jsonStr);
      if (!Array.isArray(items)) {
        throw new Error('Payload must be a JSON array of items');
      }
      return { idx, total, items };
    }

    async function init() {
      // 1. Check DecompressionStream support
      if (typeof DecompressionStream === 'undefined') {
        showError(
          'ブラウザ非対応',
          'お使いのブラウザは DecompressionStream に未対応です（iOS 16.4 以降が必要です）。'
        );
        return;
      }

      // 2. Check location.hash
      const hash = location.hash;
      if (!hash || hash.length <= 1) {
        showError(
          'データなし',
          'URLハッシュ（#以降のデータ）が見つかりません。QRコードからアクセスしてください。'
        );
        return;
      }

      // 3. Decode fragment
      let decoded;
      try {
        decoded = await decodeFragment(hash);
      } catch (e) {
        showError(
          '復号エラー',
          'データの復号に失敗しました。QRコードが途切れているか、データ形式が不正です。(' + e.message + ')'
        );
        return;
      }

      const { idx, total, items } = decoded;

      // 4. Render UI
      const headerElem = document.getElementById('viewer-header');
      const badgeElem = document.getElementById('chunk-badge');
      const countElem = document.getElementById('tab-count');
      const listElem = document.getElementById('tab-list');
      const emptyElem = document.getElementById('empty-state');
      const copyBtn = document.getElementById('copy-all-btn');

      headerElem.style.display = 'block';

      if (total > 1) {
        badgeElem.textContent = idx + ' / ' + total;
        badgeElem.style.display = 'inline-block';
      }

      // Filter valid http/https items
      const validItems = [];
      for (const item of items) {
        if (!Array.isArray(item) || item.length < 2) continue;
        const title = item[0] || '';
        const url = item[1] || '';
        if (url.startsWith('http://') || url.startsWith('https://')) {
          validItems.push([title, url]);
        }
      }

      countElem.textContent = validItems.length + ' 件のタブ';

      if (validItems.length === 0) {
        emptyElem.style.display = 'block';
        return;
      }

      // Copy All URLs button
      copyBtn.addEventListener('click', async function() {
        const textToCopy = validItems.map(function(it) { return it[1]; }).join('\n');
        try {
          await navigator.clipboard.writeText(textToCopy);
          const origText = copyBtn.textContent;
          copyBtn.textContent = 'コピー完了!';
          setTimeout(function() {
            copyBtn.textContent = origText;
          }, 1500);
        } catch (err) {
          // Fallback or ignore
        }
      });

      // Render tab list using textContent ONLY (no innerHTML)
      for (const item of validItems) {
        const title = item[0];
        const url = item[1];

        let displayTitle = title;
        if (!displayTitle) {
          try {
            const parsed = new URL(url);
            displayTitle = parsed.host + parsed.pathname;
          } catch (e) {
            displayTitle = url;
          }
        }

        const li = document.createElement('li');
        li.className = 'tab-item';

        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'item-title';
        titleDiv.textContent = displayTitle;

        const urlDiv = document.createElement('div');
        urlDiv.className = 'item-url';
        urlDiv.textContent = url;

        a.appendChild(titleDiv);
        a.appendChild(urlDiv);

        a.addEventListener('click', function() {
          li.classList.add('visited');
        });

        li.appendChild(a);
        listElem.appendChild(li);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
